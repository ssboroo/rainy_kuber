services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rainy_kuber
      POSTGRES_USER: rainy
      POSTGRES_PASSWORD: rainy_dev
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://rainy:rainy_dev@postgres:5432/rainy_kuber
      REDIS_URL: redis://redis:6379/0
      TATAR_KUBER_BIN: tatar-kuber
    ports: ["8000:8000"]
    depends_on: [postgres, redis]

  web:
    build: ./apps/web
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  postgres_data:
