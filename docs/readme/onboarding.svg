<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430">
<rect width="1400" height="430" rx="30" fill="#f8fbff"/><text x="60" y="70" font-family="Inter,Arial" font-size="32" font-weight="800" fill="#172235">Cluster Onboarding Flow</text><text x="60" y="105" font-family="Inter,Arial" font-size="16" fill="#718096">From account creation to continuous security visibility</text>
<g font-family="Inter,Arial">
<g transform="translate(60 160)"><circle cx="55" cy="55" r="55" fill="#edf4ff"/><text x="55" y="61" text-anchor="middle" font-size="30" font-weight="800" fill="#3475e6">1</text><text x="55" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#172235">Create account</text><text x="55" y="160" text-anchor="middle" font-size="12" fill="#7b8ba0">EN / MN</text></g>
<g transform="translate(300 160)"><circle cx="55" cy="55" r="55" fill="#eefaf6"/><text x="55" y="61" text-anchor="middle" font-size="30" font-weight="800" fill="#179271">2</text><text x="55" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#172235">Add cluster</text><text x="55" y="160" text-anchor="middle" font-size="12" fill="#7b8ba0">Name + environment</text></g>
<g transform="translate(540 160)"><circle cx="55" cy="55" r="55" fill="#fff7e9"/><text x="55" y="61" text-anchor="middle" font-size="30" font-weight="800" fill="#b47a1f">3</text><text x="55" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#172235">Copy agent token</text><text x="55" y="160" text-anchor="middle" font-size="12" fill="#7b8ba0">Rotatable secret</text></g>
<g transform="translate(780 160)"><circle cx="55" cy="55" r="55" fill="#f1f4ff"/><text x="55" y="61" text-anchor="middle" font-size="30" font-weight="800" fill="#596fc2">4</text><text x="55" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#172235">Install agent</text><text x="55" y="160" text-anchor="middle" font-size="12" fill="#7b8ba0">Read-only RBAC</text></g>
<g transform="translate(1020 160)"><circle cx="55" cy="55" r="55" fill="#fff0f2"/><text x="55" y="61" text-anchor="middle" font-size="30" font-weight="800" fill="#db5c69">5</text><text x="55" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#172235">Receive findings</text><text x="55" y="160" text-anchor="middle" font-size="12" fill="#7b8ba0">Score + remediation</text></g>
